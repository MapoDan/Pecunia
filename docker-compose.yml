services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pecunia
      POSTGRES_USER: pecunia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pecunia_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [pecunia]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pecunia -d pecunia"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PECUNIA_DATABASE_URL: postgresql+psycopg://pecunia:${POSTGRES_PASSWORD:-pecunia_dev_only}@postgres:5432/pecunia
      PECUNIA_CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
      PECUNIA_GOOGLE_CLIENT_ID: ${PECUNIA_GOOGLE_CLIENT_ID:-}
      PECUNIA_SESSION_SECRET: ${PECUNIA_SESSION_SECRET:-change-me-only-for-development}
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8000:8000"]
    networks: [pecunia]
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["8080:80"]
    networks: [pecunia]
volumes:
  postgres_data:
networks:
  pecunia:
    driver: bridge
